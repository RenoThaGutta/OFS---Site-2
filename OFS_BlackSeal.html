<!DOCTYPE html>
<html lang="en" style="background:#050507">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Order of the Fallen Star</title>
  <link rel="icon" type="image/png" href="ofs favicon.png">
  <style>
    :root {
      --void: #050507;
      --blood: #621717;
      --blood-bright: #9f2424;
      --gold: #c9a84c;
      --gold-lit: #efd77a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--void); }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--void);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(159,36,36,.26), transparent 28rem),
        radial-gradient(circle at 50% 55%, rgba(201,168,76,.10), transparent 32rem),
        linear-gradient(180deg, rgba(5,5,7,.45), rgba(5,5,7,.94)),
        url('Large Background Image_home.png') center/cover no-repeat;
      filter: saturate(.8) brightness(.52);
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: .24;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
    }

    .sky {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(239,215,122,.78);
      box-shadow: 0 0 8px rgba(239,215,122,.52);
      animation: twinkle var(--speed, 4s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      left: var(--x);
      top: var(--y);
      opacity: var(--opacity, .6);
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(.55); opacity: .18; }
      45% { transform: scale(1); opacity: var(--opacity, .72); }
      70% { transform: scale(.72); opacity: .35; }
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 0%, transparent 46%, rgba(0,0,0,.42) 78%, rgba(0,0,0,.72) 100%),
        linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.50));
    }

    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; }
    }
  </style>
</head>
<body aria-label="Order of the Fallen Star starfield">
  <div class="sky" aria-hidden="true">
    <span class="star" style="--x:12%;--y:18%;--opacity:.42;--speed:3.8s;--delay:.1s"></span>
    <span class="star" style="--x:22%;--y:64%;--opacity:.30;--speed:5.4s;--delay:1.8s"></span>
    <span class="star" style="--x:31%;--y:31%;--opacity:.55;--speed:4.8s;--delay:.7s"></span>
    <span class="star" style="--x:47%;--y:76%;--opacity:.28;--speed:6.2s;--delay:2.2s"></span>
    <span class="star" style="--x:58%;--y:20%;--opacity:.50;--speed:4.1s;--delay:1.1s"></span>
    <span class="star" style="--x:69%;--y:58%;--opacity:.34;--speed:5.8s;--delay:.5s"></span>
    <span class="star" style="--x:81%;--y:33%;--opacity:.62;--speed:3.5s;--delay:2.6s"></span>
    <span class="star" style="--x:91%;--y:71%;--opacity:.36;--speed:5.1s;--delay:1.4s"></span>
  </div>
  <div class="vignette" aria-hidden="true"></div>
</body>
</html>
