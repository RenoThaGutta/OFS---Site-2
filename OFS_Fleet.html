<!DOCTYPE html>
<html lang="en" style="background:#07070f">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet — Order of the Fallen Star</title>
  <link rel="icon" type="image/png" href="ofs favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ofs-api.orderofthefallenstar.workers.dev" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07070f;--bg-card:#0e0e1c;--bg-card2:#13132a;--gold:#c9a84c;--gold-lt:#e8ca6a;--gold-dim:#6e5a28;--silver:#b0b8c8;--silver-dim:#5a6272;--text:#ddd8cc;--text-dim:#7a7568;--b-gold:rgba(201,168,76,.28);--b-dim:rgba(201,168,76,.09);--glow:rgba(201,168,76,.12)}
    *{box-sizing:border-box;margin:0;padding:0} body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh;overflow-x:hidden} #starfield{position:fixed;inset:0;z-index:0;pointer-events:none}.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:104px 28px 72px}.hero{border:1px solid var(--b-gold);background:linear-gradient(135deg,rgba(201,168,76,.08),rgba(14,14,28,.92));padding:34px 38px;margin-bottom:34px}.eyebrow{font-family:Cinzel,serif;color:var(--gold);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}.hero h1{font-family:Cinzel,serif;color:var(--gold-lt);font-size:2.25rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}.hero p{font-family:'Crimson Text',serif;color:var(--silver);font-size:1.08rem;max-width:760px}.fleet-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.fleet-tab{background:transparent;border:1px solid var(--b-dim);color:var(--silver-dim);font-family:Cinzel,serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;cursor:pointer}.fleet-tab.active,.fleet-tab:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08)}.fleet-section{margin-bottom:38px}.fleet-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}.fleet-head h2{font-family:Cinzel,serif;font-size:1rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}.fleet-line{height:1px;flex:1;background:linear-gradient(to right,var(--gold-dim),transparent)}.ship-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}.ship-card{background:var(--bg-card);border:1px solid var(--b-dim);border-radius:4px;overflow:hidden;min-height:330px;display:flex;flex-direction:column;box-shadow:0 0 28px rgba(201,168,76,.03)}.ship-img{height:150px;background:var(--bg-card2);background-size:cover;background-position:center;border-bottom:1px solid var(--b-dim);display:flex;align-items:center;justify-content:center;color:var(--gold-dim);font-family:Cinzel,serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}.ship-body{padding:16px 18px;display:flex;flex-direction:column;gap:9px;flex:1}.member{font-family:Cinzel,serif;color:var(--gold-lt);font-size:.95rem;letter-spacing:.08em}.ship{color:var(--silver);font-weight:600}.make,.meta,.notes{color:var(--text-dim);font-size:.82rem}.badge{display:inline-block;width:max-content;padding:3px 8px;border:1px solid rgba(201,168,76,.3);background:rgba(201,168,76,.12);color:var(--gold);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}.empty{border:1px solid var(--b-dim);background:var(--bg-card);padding:28px;text-align:center;color:var(--text-dim);font-family:'Crimson Text',serif;font-style:italic}.site-footer{text-align:center;padding:44px 0 18px;border-top:1px solid var(--b-gold);margin-top:64px}.footer-copy{font-size:.7rem;color:var(--text-dim)}@media(max-width:760px){.wrap{padding:92px 18px 50px}.hero{padding:26px 22px}.hero h1{font-size:1.65rem}.ship-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<canvas id="starfield"></canvas>
<nav id="main-nav"></nav>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">Order Naval Registry</div>
    <h1>Fleet Command</h1>
    <p>Operational fleet assignments of the Order of the Fallen Star. Fleets are maintained from the website admin panel and drawn from the Ship Registry.</p>
  </section>
  <div class="fleet-tabs" id="fleet-tabs"></div>
  <div id="fleet-root"><div class="empty">Loading fleet registry…</div></div>
  <footer class="site-footer"><div class="footer-copy">© Order of the Fallen Star</div></footer>
</main>
<script src="ofs-data.js"></script>
<script src="ofs-sheets.js"></script>
<script src="header_bar.js"></script>
<script>
(function(){const cv=document.getElementById('starfield'),cx=cv.getContext('2d');let st=[];function resize(){cv.width=innerWidth;cv.height=innerHeight;st=[];const n=Math.floor(cv.width*cv.height/4200);for(let i=0;i<n;i++)st.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1+.2,a:Math.random()*.5+.1,s:Math.random()*.0004+.0001});}function draw(t){cx.clearRect(0,0,cv.width,cv.height);for(const s of st){const p=Math.sin(t*s.s*900+s.x*.01)*.18+.82;cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fillStyle=`rgba(190,210,255,${(s.a*p).toFixed(3)})`;cx.fill();}requestAnimationFrame(draw);}resize();addEventListener('resize',resize);requestAnimationFrame(draw);})();
function esc(s){var el=document.createElement('span');el.textContent=s==null?'':String(s);return el.innerHTML;}
function imgUrl(url){if(!url)return'';var m=String(url).match(/\/file\/d\/([^/?#]+)/);return m?'https://lh3.googleusercontent.com/d/'+m[1]:url;}
const ROLE_ORDER=['Command','Fighter','Med Evac','Support','Transport','Recon','Crew','Assigned Vessels'];
function roleRank(role){const i=ROLE_ORDER.indexOf(role||'');return i===-1?ROLE_ORDER.length:i;}
function isRuleRow(f){return f&&(f.userId==='__rules__'||f.role==='__RULES__'||String(f.id||'').indexOf('fleet-rules-')===0);}
function ruleKey(role){role=String(role||'').toLowerCase();if(role.includes('fighter'))return'fighter';if(role.includes('med')||role.includes('evac'))return'medEvac';if(role.includes('command'))return'command';if(role.includes('support'))return'support';return'';}
function rulesFor(name,all){const row=all.find(f=>isRuleRow(f)&&f.fleetName===name), rules={fighter:2,medEvac:1,command:1,support:0};if(row&&row.notes){try{Object.assign(rules,JSON.parse(row.notes));}catch(e){}}return rules;}
let activeFleet=new URLSearchParams(location.search).get('fleet') || '';
function renderFleet(){
  const root=document.getElementById('fleet-root'), tabs=document.getElementById('fleet-tabs');
  const all=(window.OFSSheets&&OFSSheets.getFleets?OFSSheets.getFleets():[]);
  const data=all.filter(f=>!isRuleRow(f)&&f.active!==false);
  if(!data.length){root.innerHTML='<div class="empty">No fleet assignments are available yet. Confirm the Fleets sheet has headers and the Worker /data endpoint exposes the Fleets tab.</div>';tabs.innerHTML='';return;}
  const names=[...new Set(data.map(f=>f.fleetName).filter(Boolean))].sort();
  if(!activeFleet||names.indexOf(activeFleet)===-1) activeFleet=names[0];
  tabs.innerHTML=names.map(n=>`<button class="fleet-tab ${n===activeFleet?'active':''}" onclick="activeFleet='${esc(n).replace(/'/g,'&#39;')}';history.replaceState(null,'','?fleet='+encodeURIComponent(activeFleet));renderFleet()">${esc(n)}</button>`).join('');
  const selected=data.filter(f=>f.fleetName===activeFleet).sort((a,b)=>roleRank(a.role)-roleRank(b.role)||(a.sortOrder||0)-(b.sortOrder||0)||(a.username||'').localeCompare(b.username||''));
  const rules=rulesFor(activeFleet,all), counts={}; selected.forEach(f=>{const k=ruleKey(f.role); if(k) counts[k]=(counts[k]||0)+1;});
  const ruleLine=Object.keys(rules).filter(k=>rules[k]).map(k=>`${k.replace('medEvac','Med Evac')}: ${(counts[k]||0)}/${rules[k]}`).join(' · ');
  const grouped={}; selected.forEach(f=>{(grouped[f.role||'Assigned Vessels']||(grouped[f.role||'Assigned Vessels']=[])).push(f);});
  root.innerHTML=(ruleLine?`<div class="empty" style="margin-bottom:18px;padding:14px">Fleet rules: ${esc(ruleLine)}</div>`:'')+Object.keys(grouped).sort((a,b)=>roleRank(a)-roleRank(b)).map(role=>`<section class="fleet-section"><div class="fleet-head"><h2>${esc(role)} <span style="color:var(--silver-dim);font-size:.72em">${grouped[role].length}</span></h2><div class="fleet-line"></div></div><div class="ship-grid">${grouped[role].map(card).join('')}</div></section>`).join('');
}
function card(f){const bg=imgUrl(f.shipImageUrl);return `<article class="ship-card"><div class="ship-img" ${bg?`style="background-image:url('${esc(bg)}')"`:''}>${bg?'':'No Ship Image'}</div><div class="ship-body"><div class="member">${esc(f.username)}</div><div class="ship">${esc(f.shipModel)}</div><div class="make">${esc(f.shipMake)}</div>${f.role?`<span class="badge">${esc(f.role)}</span>`:''}${f.banner?`<span class="badge">${esc(f.banner)}</span>`:''}<div class="meta">${f.house?`House: ${esc(f.house)}<br>`:''}${f.fleetName?`Fleet: ${esc(f.fleetName)}`:''}</div>${f.notes?`<div class="notes">${esc(f.notes)}</div>`:''}</div></article>`;}
OFSSheets.load().then(function(){ if(window.OFSHeaderBar) OFSHeaderBar.refreshBanners(); renderFleet(); }).catch(renderFleet);
</script>
</body>
</html>
